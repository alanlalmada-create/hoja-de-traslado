<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Guardia</title>
</head>
<body>

  <!-- Contenedor Principal -->
  <div class="container">
    <div id="records"></div>
  </div>

<script>
// Convierte un archivo a Base64 manteniendo sus metadatos
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve({
      filename: file.name,
      type: file.type,
      base64: reader.result.split(',')[1]
    });
    reader.onerror = error => reject(error);
  });
}

async function guardar() {
  const btn = document.getElementById("btn-guardar");
  btn.disabled = true;
  btn.innerText = "Guardando e subiendo imágenes...";

  try {
    const chofer = document.getElementById("chofer").value.trim();
    const fecha = document.getElementById("fecha").value;

    if (!chofer || !fecha) {
      alert("Por favor completa la fecha y el nombre del chofer.");
      btn.disabled = false;
      btn.innerText = "Guardar cambio de guardia";
      return;
    }

    const unidades = [];

    // Recorremos cada móvil individualmente para aislar sus fotos
    for (let ui = 0; ui < unidadesNombre.length; ui++) {
      const nombreUnidad = unidadesNombre[ui]; // "PAA 327", "PEQ 519" o "AF676BF"
      const filesInput = document.getElementById(`u${ui}_fotos`);
      const files = filesInput ? filesInput.files : [];
      const fotosBase64 = [];

      // Procesa SOLO las fotos adjuntas a esta unidad específica
      for (let f = 0; f < files.length; f++) {
        const fotoObj = await fileToBase64(files[f]);
        fotosBase64.push(fotoObj);
      }

      // Empaquetamos la unidad con SUS correspondientes fotos
      unidades.push({
        nombre: nombreUnidad,
        operativo: document.getElementById(`u${ui}_operativo`).value,
        estados: items.map((it, ii) => document.getElementById(`u${ui}i${ii}`).value),
        verificaciones: {
          residuos: document.getElementById(`u${ui}_residuos`).value,
          llave: document.getElementById(`u${ui}_llave`).value,
          acople: document.getElementById(`u${ui}_acople`).value
        },
        fotos: fotosBase64, // Fotos exclusivas de este móvil
        obs: document.getElementById(`uo${ui}`).value.trim()
      });
    }

    const payload = {
      chofer: chofer,
      fecha: fecha,
      unidades: unidades
    };

    // Envío directo a Google Apps Script (Omite Firebase Storage)
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.ok) {
      alert("¡Guardia y fotos guardadas con éxito en Google Sheets!");
      limpiar();
    } else {
      throw new Error(result.error || "Error al procesar los datos.");
    }

  } catch (error) {
    console.error("Error al guardar:", error);
    alert("Error al guardar: " + error.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "Guardar cambio de guardia";
  }
}

async function cargarHistorial() {
  try {
    // ... código de renderizado de historial ...
    const container = document.getElementById("records");
    
    container.innerHTML = docs.length ? docs.map(doc => `
        <div class="card">
          <h3>${doc.chofer} - ${doc.fecha}</h3>
          <div>
            ${doc.unidades.map(u => {
                const verificacionesTxt = [];
                if(u.verificaciones?.residuos) verificacionesTxt.push(`Residuos: ${u.verificaciones.residuos}`);
                if(u.verificaciones?.llave) verificacionesTxt.push(`Llave: ${u.verificaciones.llave}`);
                if(u.verificaciones?.acople) verificacionesTxt.push(`Acople: ${u.verificaciones.acople}`);

                const fotosHtml = u.fotos && u.fotos.length 
                  ? `<div style="margin-top:6px;"><strong>Fotos:</strong> ${u.fotos.length} adjunta(s)</div>`
                  : "";

                return `
                  <div style="border-bottom:1px solid #ccc; padding:8px 0;">
                    <strong>${u.nombre}</strong> - ${u.operativo}

                    ${
                      verificacionesTxt.length
                      ? `
                        <div style="margin-top:6px; font-size:12px; color:var(--muted)">
                          <strong>Verificaciones:</strong> ${verificacionesTxt.join(" | ")}
                        </div>
                      `
                      : ""
                    }

                    ${
                      u.obs
                      ? `
                        <div style="margin-top:6px; font-size:12px">
                          <strong>Observaciones:</strong> ${u.obs}
                        </div>
                      `
                      : ""
                    }

                    ${fotosHtml}

                  </div>
                `;
              }).join("")}

          </div>

        </div>
      `).join("")

      : '<div class="empty">No hay registros de guardias guardados aún.</div>';

  } catch(err) {
    console.error("Error al cargar historial:", err);
    alert("Error al cargar el historial: " + err.message);
  }
}
</script>
</body>
</html>
